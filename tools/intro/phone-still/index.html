<!doctype html>
<!--
  The intro phone on its own, for tools/intro/phone-still/render.mjs and for checking it by eye.
  Served by Vite from the repo root (render.mjs starts it), never part of the site.

  URL options:
    ?w=600&h=600     the box size in CSS px (default 600 x 600)
    ?motion=0        reduced motion: closed, in its display pose, still (default: motion on)
    ?bg=transparent  no page background (the still); bg=night (default) is the site's night with
                     the module's golden halo behind the phone, as Intro.astro draws it
    ?debug           window.__phone: frame count, pose() and focus() for close-ups
    ?dpr=2           (with debug) a fixed pixel ratio, past the 1.3 megapixel cap
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Phone still</title>
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #05070d;
      }
      body.transparent {
        background: transparent;
      }
      .box {
        position: relative;
      }
      body:not(.transparent) .box::before {
        content: '';
        position: absolute;
        inset: -10%;
        background: radial-gradient(circle closest-side, rgb(255 182 92 / 0.22), rgb(255 182 92 / 0.18) 40%, rgb(255 182 92 / 0.08) 68%, rgb(255 182 92 / 0) 100%);
      }
      .box canvas {
        position: absolute;
        display: block;
        max-width: none;
        pointer-events: none;
      }
      .box:focus-visible {
        outline: 2px solid #ffb65c;
        outline-offset: 2px;
        box-shadow: 0 0 0 6px #05070d;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="box" data-intro-phone role="img" aria-label="A folding phone"></div>
    <script type="module">
      import { mountPhone } from '/src/intro/phone/index.ts';
      const q = new URLSearchParams(location.search);
      const box = document.querySelector('[data-intro-phone]');
      box.style.width = `${Number(q.get('w') || 600)}px`;
      box.style.height = `${Number(q.get('h') || 600)}px`;
      if (q.get('bg') === 'transparent') document.body.classList.add('transparent');
      mountPhone(box, { motion: q.get('motion') !== '0' });
    </script>
  </body>
</html>
