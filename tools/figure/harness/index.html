<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Figure harness</title>
    <!--
      Static test page for the point figure, laid out like the Datum hero. Serve the repo root:
        node tools/figure/harness/serve.mjs   (or: python3 -m http.server from the repo root)
        http://127.0.0.1:4317/tools/figure/harness/index.html
      Query parameters:
        motion=off        same as html[data-motion="off"]
        snapshot=1        same as html[data-snapshot] (white, darker and larger points, still)
        device=phone|laptop   force the point count and sizes (default: detect)
        count=N           draw N points
        still=1           one settled frame, no animation
        transparent=1     no plate or page color (used by render-fallback.mjs)
        bare=1            the plate fills the viewport (used by render-fallback.mjs)
        yaw=deg pitch=deg base pose
        src= srclo= srcmeta=   other data files
        point=css origin=css floor=0.55 scale=1   override the tokens
        gl=1              force WebGL1
    -->
    <style>
      :root {
        --chart: #e2e8e9;
        --vellum: #f4f7f7;
        --ink: #13212d;
        --slate: #4a5965;
        --bg: var(--chart);
        --plate: var(--vellum);
        --text: var(--ink);
        --figure-point: var(--ink);
        --figure-origin-b: #cc5216;
        --figure-alpha-floor: 0.55;
        --figure-point-scale: 1;
        --dur-fade: 240ms;
        --ease-quick: cubic-bezier(0.2, 0, 0, 1);
      }
      html[data-snapshot] {
        --bg: #ffffff;
        --plate: #ffffff;
        --text: #0b1620;
        --figure-point: #0b1620;
        --figure-origin-b: #0b1620;
        --figure-alpha-floor: 0.8;
        --figure-point-scale: 1.25;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 Arial, sans-serif; }
      .hero { display: grid; gap: 32px; padding: 32px 16px 96px; max-width: 80rem; margin: 0 auto; }
      .hero__name { font: 500 52px/0.98 Georgia, serif; margin: 0; }
      .hero__plate {
        position: relative;
        width: 100%;
        aspect-ratio: 9 / 10;
        background: var(--plate);
        border: 1px solid var(--slate);
        overflow: hidden;
      }
      .hero__figure { position: absolute; inset: 0; }
      .hero__corner { position: absolute; top: 12px; font-size: 14px; color: var(--slate); z-index: 2; }
      .hero__corner--a { left: 12px; }
      .hero__corner--b { right: 12px; }
      .tick { position: absolute; width: 14px; height: 1px; background: var(--slate); z-index: 2; }
      .caption { display: flex; gap: 12px; align-items: center; font-size: 15px; color: var(--slate); margin-top: 12px; }
      .caption button { min-height: 44px; padding: 0 16px; border: 1px solid var(--slate); background: transparent; color: var(--text); font: inherit; }
      @media (min-width: 1024px) {
        .hero { grid-template-columns: 5fr 7fr; align-items: center; }
        .hero__name { font-size: 112px; }
        .hero__fig { justify-self: end; width: min(100%, 608px); }
        .hero__plate { aspect-ratio: 4 / 5; }
      }
      .spacer { height: 1400px; }
      .stats { position: fixed; left: 8px; bottom: 8px; font: 12px/1.3 ui-monospace, monospace; background: rgb(0 0 0 / 0.65); color: #fff; padding: 4px 6px; border-radius: 3px; }
      body.bare .hero { display: block; padding: 0; max-width: none; }
      body.bare .hero__fig { width: 100%; }
      body.bare .hero__plate { position: fixed; inset: 0; aspect-ratio: auto; border: 0; }
      body.bare .hero__text, body.bare .caption, body.bare .spacer, body.bare .stats, body.bare .hero__corner, body.bare .tick { display: none; }
      html.transparent, body.transparent, body.transparent .hero__plate { background: transparent !important; }

      /* Same rules as src/components/Figure.astro. */
      .figure { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .figure__canvas, .figure__fallback { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity var(--dur-fade) var(--ease-quick); }
      .figure__canvas { display: block; }
      .figure__fallback { display: none; opacity: 0; object-fit: cover; object-position: 50% 0%; }
      .figure[data-fallback-shown] .figure__fallback { display: block; }
      .figure[data-state='fallback'] .figure__fallback { opacity: 1; }
      .figure[data-state='fallback'] .figure__canvas { opacity: 0; }
      @media (scripting: none) {
        .figure__fallback { display: block; opacity: 1; }
        .figure__canvas { display: none; }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="hero__text">
        <h1 class="hero__name">Cayden Auyang</h1>
        <p>Harness for the point figure. Move the pointer over this section, or scroll.</p>
      </div>
      <figure class="hero__fig" style="margin: 0">
        <div class="hero__plate" data-origin-a-y="0.2033" data-origin-b-y="0.6920">
          <div class="hero__figure" data-figure role="img" aria-label="A figure of Cayden made of points.">
            <div class="figure" data-figure-mount data-state="idle">
              <canvas class="figure__canvas" aria-hidden="true"></canvas>
              <img class="figure__fallback" src="/public/figure/figure-fallback.webp" alt="" aria-hidden="true" width="720" height="900" loading="lazy" decoding="async" />
            </div>
          </div>
          <span class="hero__corner hero__corner--a">Pomfret</span>
          <span class="hero__corner hero__corner--b">Hong Kong</span>
          <span class="tick" style="left: 0; top: 20.33%"></span>
          <span class="tick" style="right: 0; top: 69.2%"></span>
        </div>
        <figcaption class="caption"><span>Fig. 1&nbsp; Cayden, in <span id="count">…</span> points.</span><button type="button" id="replay" hidden>Replay</button></figcaption>
      </figure>
    </section>
    <div class="spacer"></div>
    <div class="stats" id="stats">loading</div>
    <script type="module">
      const q = new URLSearchParams(location.search);
      const html = document.documentElement;
      if (q.get('motion') === 'off') html.setAttribute('data-motion', 'off');
      if (q.has('snapshot')) html.setAttribute('data-snapshot', '');
      if (q.has('bare')) document.body.classList.add('bare');
      if (q.has('transparent')) {
        document.body.classList.add('transparent');
        html.classList.add('transparent');
      }
      const root = document.querySelector('[data-figure-mount]');
      const canvas = root.querySelector('canvas');
      const colors = q.has('point') || q.has('origin') ? { point: q.get('point') || undefined, originB: q.get('origin') || undefined } : null;
      document.querySelector('.hero__plate').addEventListener('figure:ready', (e) => {
        document.getElementById('count').textContent = e.detail.count.toLocaleString('en-US');
        window.__readyCount = e.detail.count;
        document.getElementById('replay').hidden = !!(q.has('still') || html.hasAttribute('data-snapshot') || html.getAttribute('data-motion') === 'off' || matchMedia('(prefers-reduced-motion: reduce)').matches);
      });
      document.getElementById('replay').addEventListener('click', () => root.dispatchEvent(new CustomEvent('figure:replay', { bubbles: true })));

      function start() {
        import('/src/figure/index.js').then(({ mountFigure }) => {
          window.__fig = mountFigure(canvas, {
            srcHi: q.get('src') || '/public/figure/figure-hi.bin',
            srcLo: q.get('srclo') || '/public/figure/figure-lo.bin',
            srcMeta: q.get('srcmeta') || '/public/figure/figure.json',
            fallbackImg: root.querySelector('img'),
            device: q.get('device') || 'auto',
            count: Number(q.get('count') || 0),
            still: q.has('still'),
            yaw: Number(q.get('yaw') || 0),
            pitch: Number(q.get('pitch') || 0),
            colors,
            alphaFloor: q.has('floor') ? Number(q.get('floor')) : null,
            pointScale: q.has('scale') ? Number(q.get('scale')) : null,
            forceWebGL1: q.get('gl') === '1',
          });
          const out = document.getElementById('stats');
          setInterval(() => {
            const s = window.__fig.stats;
            out.textContent = `${s.state} webgl${s.webgl} ${s.device} ${s.file} ${s.count} pts  ${s.frames} frames  ${s.fps.toFixed(0)} fps${s.reason ? '  ' + s.reason : ''}`;
          }, 300);
        });
      }
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if ('requestIdleCallback' in window) requestIdleCallback(start, { timeout: 1200 });
        else setTimeout(start, 200);
      }));
    </script>
  </body>
</html>
