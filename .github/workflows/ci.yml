# ci.yml: checks every pull request and every push to main.
#
# A fresh computer downloads the project, installs the exact package versions from
# package-lock.json, and builds the site. If the build fails, the check shows a red cross.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact package versions
        run: npm ci

      - name: Build the site
        run: npm run build
